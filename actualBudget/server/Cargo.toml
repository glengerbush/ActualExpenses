[package]
name = "actualbudget-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
csv = "=1.4.0"
encoding_rs = "=0.8.35"
regress = { package = "jlens-regress", version = "=0.31.0", path = "vendor/jlens-regress", default-features = false, features = ["std", "utf16", "prohibit-unsafe"] }
axum = "=0.8.9"
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
rusqlite = { version = "=0.38.0", features = ["bundled", "limits", "hooks", "functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "=0.6.10", features = ["fs"] }
uuid = { version = "=1.23.1", features = ["v4", "serde"] }

sha2 = "=0.10.9"
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
tempfile = "=3.27.0"
roxmltree = "=0.21.2"

base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
